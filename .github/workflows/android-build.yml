name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Ensure gradle wrapper is executable if present
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Generate debug keystore
        run: |
          # Create debug keystore matching app/build.gradle.kts signing config
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Android, L=Unknown, ST=Unknown, C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        # Try wrapper first; if missing, fall back to installed gradle
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
